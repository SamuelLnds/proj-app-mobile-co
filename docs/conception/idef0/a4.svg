<polyline points="636,538 636,500" fill="none" stroke="#1f5f99" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ahA)"/>
<text x="644" y="543" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">PostgreSQL +</text>
