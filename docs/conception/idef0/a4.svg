<text x="500.0" y="329.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a1a1a">avec hystérésis</text>
<text x="578" y="368" font-size="14" text-anchor="end" font-weight="bold" fill="#1f5f99">A42</text>
