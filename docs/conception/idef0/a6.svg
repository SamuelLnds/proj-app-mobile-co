<text x="35" y="354" font-size="20" text-anchor="middle" font-weight="normal" fill="#1a1a1a">)</text>
<text x="14" y="316" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Statut de l'objet</text>
<text x="14" y="331" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(en ligne ou non)</text>
<polyline points="380,200 397,200 397,305 415,305" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="407" y="269" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Consigne confirmée</text>
<polyline points="585,325 602,325 602,440 620,440" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="612" y="394" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Consigne publiée</text>
<polyline points="790,460 807,460 807,565 825,565" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="817" y="519" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Flux, statut, raison</text>
<polyline points="585,297 1190,297" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="945" y="291" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Consigne enregistrée</text>
<polyline points="790,422 1190,422" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="1000" y="401" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">État appliqué de la</text>
<text x="1000" y="416" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">batterie et du réseau</text>
<polyline points="995,575 1190,575" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="1003" y="554" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">État appliqué publié</text>
<text x="1003" y="569" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(statut et raison)</text>
<polyline points="330,50 330,150" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="342" y="54" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Rôles exploitant / lecteur :</text>
<text x="342" y="69" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">bouton masqué au lecteur (A61),</text>
<text x="342" y="84" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">refus 403 côté API (A62)</text>
<polyline points="330,120 535,120 535,275" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<circle cx="330" cy="120" r="3.2" fill="#222222"/>
<polyline points="565,150 565,275" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="556" y="156" font-size="20" text-anchor="middle" font-weight="normal" fill="#1a1a1a">(</text>
<text x="574" y="156" font-size="20" text-anchor="middle" font-weight="normal" fill="#1a1a1a">)</text>
<text x="585" y="154" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Bornes : part de 0 à 100 %,</text>
<text x="585" y="169" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">par pas de 10</text>
<polyline points="750,215 750,400" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="756" y="219" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Règles de pilotage :</text>
<text x="756" y="234" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">batterie pleine 95 %, faible 20 %,</text>
<text x="756" y="249" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">charge max. 3 000 W,</text>
<text x="756" y="264" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">charge auto jusqu'à 80 %</text>
<polyline points="955,345 955,525" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#ah)"/>
<text x="946" y="351" font-size="20" text-anchor="middle" font-weight="normal" fill="#1a1a1a">(</text>
<text x="964" y="351" font-size="20" text-anchor="middle" font-weight="normal" fill="#1a1a1a">)</text>
<text x="975" y="349" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Format de l'état</text>
<text x="975" y="364" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(statut, raison)</text>
<text x="1186" y="728" font-size="12" text-anchor="end" font-weight="normal" fill="#1a1a1a">( ) flèche tunnelée : absente du diagramme parent</text>
<rect x="20" y="430" width="380" height="94" fill="#fff" stroke="#999" stroke-width="1"/>
<rect x="20" y="430" width="4" height="94" fill="#1f5f99"/>
<text x="34" y="448" font-size="13" text-anchor="start" font-weight="bold" fill="#1a1a1a">Côté API (A62)</text>
<text x="34" y="466" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">Refus si lecteur (403), part hors bornes (422) ou objet</text>
<text x="34" y="482" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">hors ligne (409). Consigne publiée en QoS 1, conservée</text>
<text x="34" y="498" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">par le broker. Sans réponse après 30 s : « sans réponse »</text>
<text x="34" y="514" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">et alerte critique.</text>
<rect x="20" y="538" width="380" height="110" fill="#fff" stroke="#999" stroke-width="1"/>
<rect x="20" y="538" width="4" height="110" fill="#1f5f99"/>
<text x="34" y="556" font-size="13" text-anchor="start" font-weight="bold" fill="#1a1a1a">Côté objet (A63), chaque seconde</text>
<text x="34" y="574" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">Manuel : part choisie, limitée à 3 000 W (appliquée ou</text>
<text x="34" y="590" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">appliquée en partie). Automatique : tout à la batterie</text>
<text x="34" y="606" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">sous 80 %, sinon au réseau. Restitution : décharge à</text>
<text x="34" y="622" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">3 000 W, refusée à 20 % ou moins. Charge refusée à 95 %</text>
<text x="34" y="638" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">ou plus ; consigne invalide refusée.</text>
<rect x="20" y="662" width="380" height="62" fill="#fff" stroke="#999" stroke-width="1"/>
<rect x="20" y="662" width="4" height="62" fill="#1f5f99"/>
<text x="34" y="680" font-size="13" text-anchor="start" font-weight="bold" fill="#1a1a1a">Compte rendu (A64)</text>
<text x="34" y="698" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">Appliquée, appliquée en partie ou refusée, avec la raison ;</text>
<text x="34" y="714" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">l'app l'affiche en interrogeant l'API toutes les 2 s.</text>
