# Configuration du broker Mosquitto du projet (voir docs/conception/03-cartographie-technique.md).
# Les fichiers sont copiés dans /etc/mosquitto-solar au démarrage du conteneur (voir docker-compose.yml).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Aucun accès anonyme : chaque client a son identifiant et ses droits
allow_anonymous false
password_file /etc/mosquitto-solar/passwd
acl_file /etc/mosquitto-solar/acl

# Écoute locale, sans TLS, publiée uniquement sur 127.0.0.1 (API, simulateur, outils)
listener 1883

# Écoute TLS, pour les clients extérieurs (ESP32 dans Wokwi via un tunnel)
listener 8883
cafile /etc/mosquitto-solar/ca.crt
certfile /etc/mosquitto-solar/server.crt
keyfile /etc/mosquitto-solar/server.key
tls_version tlsv1.2
