# Configuration du broker Mosquitto du projet (voir docs/conception/03-cartographie-technique.md).
# Les fichiers sont copiés dans /etc/mosquitto-solar au démarrage du conteneur (voir docker-compose.yml).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Chaque écoute a sa propre authentification et ses propres droits (D027) :
# identifiant et mot de passe en local, certificat client sur l'écoute exposée.
per_listener_settings true

# Écoute locale, sans TLS, publiée uniquement sur 127.0.0.1 : API et simulateur.
listener 1883
listener_allow_anonymous false
password_file /etc/mosquitto-solar/passwd
acl_file /etc/mosquitto-solar/acl

# Écoute TLS exposée (ESP32 de Wokwi, via un tunnel puis le VPS) : TLS mutuel.
# Seuls les objets porteurs d'un certificat signé par l'autorité des objets, non expiré et
# absent de la liste de révocation, se connectent ; le nom commun du certificat devient
# l'identifiant MQTT, et l'ACL des objets, écrite par l'API, refuse tout par défaut.
listener 8883
listener_allow_anonymous false
certfile /etc/mosquitto-solar/server.crt
keyfile /etc/mosquitto-solar/server.key
cafile /etc/mosquitto-solar/devices-ca.crt
crlfile /etc/mosquitto-solar/devices.crl
require_certificate true
use_identity_as_username true
acl_file /etc/mosquitto-solar/devices.acl
tls_version tlsv1.2
