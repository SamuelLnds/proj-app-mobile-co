# Configuration du serveur ntfy (D029). Fichier versionné : aucun secret ici.
# Les utilisateurs et les jetons d'accès sont créés par « pnpm ntfy:setup » dans la base
# d'authentification (volume Docker solar-ntfy-data), jamais dans ce fichier.

# Adresse sous laquelle le téléphone joint le serveur (liens et abonnements). Surchargée par la
# variable NTFY_BASE_URL du Docker Compose : HTTPS sur le VPS.
base-url: "http://localhost:8090"

# Le conteneur écoute sur le port 80 ; le Docker Compose le publie sur 127.0.0.1 uniquement.
listen-http: ":80"

# Base des utilisateurs, des jetons et des droits d'accès.
auth-file: "/var/lib/ntfy/user.db"
# Aucun accès sans jeton : un abonné anonyme est refusé, sur tous les sujets.
auth-default-access: "deny-all"

# Vrai derrière un proxy inverse (Caddy sur le VPS), pour lire l'adresse réelle du client.
# Surchargé par la variable NTFY_BEHIND_PROXY du Docker Compose.
behind-proxy: false

# Cache de messages court : un téléphone qui se reconnecte récupère les alertes récentes.
cache-file: "/var/lib/ntfy/cache.db"
cache-duration: "6h"

# Pas d'interface web : seuls l'app Android ntfy et l'API utilisent le serveur.
web-root: "disable"
