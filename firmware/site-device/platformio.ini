; Firmware de l'objet du site (ESP32 simulé dans Wokwi, voir docs/journal/decisions/D007-objet-wokwi.md).
; Compilation : pio run   (le binaire est ensuite lu par wokwi.toml)

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.9.1
