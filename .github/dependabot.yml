version: 2

updates:
  # Dépendances npm : le workspace pnpm est géré depuis la racine
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # Mises à jour mineures et correctifs regroupés en une seule pull request
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
